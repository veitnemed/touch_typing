name: QA only - Preview 8 Windows typing and correction
on:
  push:
    branches: [qa/touchtyping-preview8-native-check]
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: bash
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/preview8-windows-check"
          bash windows/build-release.sh "$p/pack"
          (cd "$p/pack" && zip -qr "$p/touchtyping-preview8-qa.zip" .)
          cd "$p"
          sha256sum touchtyping-preview8-qa.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: preview8-windows-check
          path: ${{ runner.temp }}/preview8-windows-check/*.zip
          if-no-files-found: error
  typing:
    needs: pack
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: preview8-windows-check
          path: ${{ runner.temp }}/preview8-windows-check
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p = "$env:RUNNER_TEMP/preview8-windows-check"
          $app = "$env:RUNNER_TEMP/TouchTyping Preview8 QA"
          Expand-Archive -LiteralPath "$p/touchtyping-preview8-qa.zip" -DestinationPath $app
          $proof = "$env:RUNNER_TEMP/preview8-typing-proof"
          & './windows/Test-TypingReview.ps1' -Application "$app/TouchTyping.exe" -OutputDirectory "$proof/review"
          & './windows/Test-Typing-Mixed.ps1' -Application "$app/TouchTyping.exe" -OutputDirectory "$proof/mixed"
          & './windows/Test-TypingCardRecords.ps1' -Application "$app/TouchTyping.exe" -OutputDirectory "$proof/history"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview8-typing-proof
          path: ${{ runner.temp }}/preview8-typing-proof/
          if-no-files-found: warn
