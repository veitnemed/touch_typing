name: Qualify TouchTyping archives and publish explicit previews
on:
  push:
    branches: [feature/live-ux-acceptance, qa/touchtyping-nov25-acceptance]
permissions:
  contents: read
env:
  PRODUCT_SHA: "${{ github.sha }}"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build the release candidates and test the shared engine
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          p="$RUNNER_TEMP/live-workflows"
          mkdir -p "$p"
          bash linux/build-release.sh "$p/touch-typing-linux-x64"
          bash windows/build-release.sh "$p/windows-x64"
          tar --sort=name --mtime='UTC 2026-11-25' --owner=0 --group=0 --numeric-owner -czf "$p/touch-typing-candidate-linux-x64.tar.gz" -C "$p" touch-typing-linux-x64
          (cd "$p/windows-x64" && zip -qr "$p/touch-typing-candidate-windows-x64.zip" .)
          (cd "$p" && sha256sum touch-typing-candidate-* > SHA256SUMS.txt)
          printf '%s\n' "$PRODUCT_SHA" > "$p/SOURCE-SHA.txt"
          for suite in SharedRegression LabRegression TerminalRegression LabStressTests TypingReviewTests; do
            dotnet run --project "linux/tests/$suite.csproj" -c Release
          done
          export PYTHONPATH="$PWD/linux" TOUCH_TYPING_ENGINE="$p/touch-typing-linux-x64/engine/TouchTyping.Engine"
          /usr/bin/python3 linux/tests/test_practice.py
          /usr/bin/python3 linux/tests/test_classic_cycles.py
          /usr/bin/python3 linux/tests/test_mixed_typing.py
          /usr/bin/python3 linux/tests/test_typing_mode_records.py
          /usr/bin/python3 linux/tests/test_typing_review.py
          /usr/bin/python3 linux/tests/test_live_entry_preferences.py
          /usr/bin/python3 linux/tests/test_live_missions.py
          /usr/bin/python3 linux/tests/test_editor_notebooks.py
          /usr/bin/python3 linux/tests/test_project_file_practice.py
          /usr/bin/python3 linux/tests/test_win10_protocol.py "$TOUCH_TYPING_ENGINE"
          /usr/bin/python3 linux/tests/audit_live_shortcuts.py
      - uses: actions/upload-artifact@v4
        with:
          name: live-verified-archives
          path: |
            ${{ runner.temp }}/live-workflows/touch-typing-candidate-*
            ${{ runner.temp }}/live-workflows/SHA256SUMS.txt
            ${{ runner.temp }}/live-workflows/SOURCE-SHA.txt
          if-no-files-found: error
  linux-native:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: download_candidate
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: live-verified-archives
          path: ${{ runner.temp }}/archives
      # Artifact indexing can lag behind the successful upload job.
      - if: steps.download_candidate.outcome == 'failure'
        shell: bash
        run: sleep 15
      - if: steps.download_candidate.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: live-verified-archives
          path: ${{ runner.temp }}/archives
      - name: Run installed GTK from the actual archive on a clean X11 profile
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth ffmpeg x11-utils x11-xkb-utils gir1.2-gtk-4.0 python3-gi python3-cairo python3-gi-cairo libxtst6 libglib2.0-bin
          p="$RUNNER_TEMP/archives"
          (cd "$p" && sha256sum -c SHA256SUMS.txt)
          temp=$(mktemp -d)
          tar -xzf "$p/touch-typing-candidate-linux-x64.tar.gz" -C "$temp"
          package="$temp/touch-typing-linux-x64"
          export TOUCH_TYPING_QA_OUTPUT="$RUNNER_TEMP/gtk-proof" TOUCH_TYPING_ENGINE="$package/engine/TouchTyping.Engine"
          export XDG_DATA_HOME="$temp/data" XDG_RUNTIME_DIR="$temp/runtime" TOUCH_TYPING_QA_DATA_ROOT="$temp/profile"
          mkdir -p -m 700 "$TOUCH_TYPING_QA_OUTPUT" "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR" "$TOUCH_TYPING_QA_DATA_ROOT"
          export PYTHONPATH="$package:$PWD/linux/tests" GDK_BACKEND=x11 GTK_A11Y=none GSK_RENDERER=cairo GSETTINGS_BACKEND=memory
          timeout 150s xvfb-run -a -s "-screen 0 1024x600x24 -nolisten tcp" bash -c '
            set -e
            ffmpeg -y -loglevel warning -f x11grab -framerate 15 -video_size 1024x600 -i "$DISPLAY" -c:v libx264 -preset fast -crf 25 -pix_fmt yuv420p "$TOUCH_TYPING_QA_OUTPUT/gtk-workflow.mp4" &
            video=$!
            trap "kill -INT $video 2>/dev/null || true; wait $video || true" EXIT
            /usr/bin/python3 linux/tests/test_preview2_native.py
          ' | tee "$TOUCH_TYPING_QA_OUTPUT/gtk-test.log"
          smoke_failures=()
          for scenario in test_editor_notebooks_x11.py test_project_files_x11.py test_typing_cycles_native.py test_typing_records_gtk.py test_typing_mixed_native.py test_typing_review_native.py test_live_guide_layout_native.py; do
            export TOUCH_TYPING_QA_OUTPUT="$RUNNER_TEMP/gtk-proof/${scenario%.py}" TOUCH_TYPING_QA_DATA_ROOT="$temp/${scenario%.py}"
            mkdir -m 700 "$TOUCH_TYPING_QA_OUTPUT" "$TOUCH_TYPING_QA_DATA_ROOT"
            export SCENARIO="$scenario" TOUCH_TYPING_QA_VIDEO=1
            if ! timeout 180s xvfb-run -a -s "-screen 0 1024x600x24 -nolisten tcp" bash -c '
              set -e
              ffmpeg -y -loglevel warning -f x11grab -framerate 15 -video_size 1024x600 -i "$DISPLAY" \
                -c:v libx264 -preset fast -crf 25 -pix_fmt yuv420p "$TOUCH_TYPING_QA_OUTPUT/session.mp4" &
              video=$!
              trap "kill -INT $video 2>/dev/null || true; wait $video || true" EXIT
              case "$SCENARIO" in
                test_typing_*) dbus-run-session -- /usr/bin/python3 "linux/tests/$SCENARIO";;
                *) /usr/bin/python3 "linux/tests/$SCENARIO";;
              esac
            ' | tee "$TOUCH_TYPING_QA_OUTPUT/gtk-test.log"; then smoke_failures+=("$scenario"); fi
          done
          if (( ${#smoke_failures[@]} )); then
            printf 'Failed native scenarios: %s\n' "${smoke_failures[@]}"
            exit 1
          fi
          timeout 55s xvfb-run -a -s "-screen 0 1366x768x24 -nolisten tcp" dbus-run-session -- \
            /usr/bin/python3 linux/tests/test_typing_normal_launch_x11.py "$package/touch_typing.py" "$temp" "$RUNNER_TEMP/gtk-proof/ordinary"
          export TOUCH_TYPING_QA_OUTPUT="$RUNNER_TEMP/gtk-proof"
          unset TOUCH_TYPING_QA_DATA_ROOT
          export XDG_DATA_HOME="$temp/repeat-data"
          mkdir -p -m 700 "$XDG_DATA_HOME"
          timeout 40s xvfb-run -a -s "-screen 0 1024x600x24 -nolisten tcp" bash -c '
            set -eu
            export TOUCH_TYPING_QA_XVFB_PID="$(pgrep -f "^Xvfb $DISPLAY " | head -n 1)"
            test -n "$TOUCH_TYPING_QA_XVFB_PID"
            /usr/bin/python3 linux/tests/test_live_backspace_x11.py
          ' | tee "$TOUCH_TYPING_QA_OUTPUT/gtk-backspace.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-gtk-proof
          path: ${{ runner.temp }}/gtk-proof/
          if-no-files-found: warn
  windows-native:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: download_candidate
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: live-verified-archives
          path: ${{ runner.temp }}/archives
      # Artifact indexing can lag behind the successful upload job.
      - if: steps.download_candidate.outcome == 'failure'
        shell: bash
        run: sleep 15
      - if: steps.download_candidate.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: live-verified-archives
          path: ${{ runner.temp }}/archives
      - name: Verify and run the extracted WPF application
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "$($os.Caption) $($os.BuildNumber) $env:RUNNER_ARCH"
          $pkg = "$env:RUNNER_TEMP/archives"
          if ((Get-Content "$pkg/SOURCE-SHA.txt" -Raw).Trim() -ne $env:PRODUCT_SHA) { throw 'Source mismatch' }
          $zip = "$pkg/touch-typing-candidate-windows-x64.zip"
          $hash = ((Get-Content "$pkg/SHA256SUMS.txt" | Where-Object { $_ -match 'windows-x64\.zip$' }) -split '\s+')[0]
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $hash) { throw 'Archive mismatch' }
          $app = "$env:RUNNER_TEMP/TouchTyping Live Candidate"
          Expand-Archive -LiteralPath $zip -DestinationPath $app
          $proof = "$env:RUNNER_TEMP/windows-proof"
          $failed = @()
          try { & "./windows/Test-Typing-Session.ps1" -Application "$app/TouchTyping.exe" -OutputDirectory "$proof/typing-session" } catch { $failed += $_.Exception.Message; Write-Host $_.Exception.Message }
          try { & "./windows/Test-TypingCardRecords.ps1" -Application "$app/TouchTyping.exe" -OutputDirectory "$proof/typing-records" } catch { $failed += $_.Exception.Message; Write-Host $_.Exception.Message }
          try { & "./windows/Test-Typing-Mixed.ps1" -Application "$app/TouchTyping.exe" -OutputDirectory "$proof/typing-mixed" } catch { $failed += $_.Exception.Message; Write-Host $_.Exception.Message }
          try { & "$app/Test-TypingReview.ps1" -Application "$app/TouchTyping.exe" -OutputDirectory "$proof/typing-review" } catch { $failed += $_.Exception.Message; Write-Host $_.Exception.Message }
          try { & "$app/Test-Live-UI.ps1" -Application "$app/TouchTyping.exe" -NativeLayout -Seed 0 -OutputDirectory "$proof/live-layout" } catch { $failed += $_.Exception.Message; Write-Host $_.Exception.Message }
          try { & "$app/Test-Live-UI.ps1" -Application "$app/TouchTyping.exe" -NotebookMission -Seed 0 -OutputDirectory "$proof/notebook" } catch { $failed += $_.Exception.Message; Write-Host $_.Exception.Message }
          try { & "$app/Test-Live-UI.ps1" -Application "$app/TouchTyping.exe" -ProjectFileMission -Seed 0 -OutputDirectory "$proof/project-files" } catch { $failed += $_.Exception.Message; Write-Host $_.Exception.Message }
          try { & "$app/Test-Live-UI.ps1" -Application "$app/TouchTyping.exe" -EditorProjectFileMission -Seed 0 -OutputDirectory "$proof/editor-project-files" } catch { $failed += $_.Exception.Message; Write-Host $_.Exception.Message }
          try { & "$app/Test-Live-UI.ps1" -Application "$app/TouchTyping.exe" -BrowserClone -Seed 0 -OutputDirectory "$proof/browser" } catch { $failed += $_.Exception.Message; Write-Host $_.Exception.Message }
          try { & "$app/Test-Live-UI.ps1" -Application "$app/TouchTyping.exe" -WorkdayNumLock off -Seed 0 -OutputDirectory "$proof/keypad-off" } catch { $failed += $_.Exception.Message; Write-Host $_.Exception.Message }
          try { & "$app/Test-Live-UI.ps1" -Application "$app/TouchTyping.exe" -WorkdayNumLock on -Seed 0 -OutputDirectory "$proof/keypad-on" } catch { $failed += $_.Exception.Message; Write-Host $_.Exception.Message }
          try { & "$app/Test-Live-UI.ps1" -Application "$app/TouchTyping.exe" -WorkdayNumLock dedicated -Seed 0 -OutputDirectory "$proof/dedicated-home" } catch { $failed += $_.Exception.Message; Write-Host $_.Exception.Message }
          try { & "$app/Test-Live-UI.ps1" -Application "$app/TouchTyping.exe" -LiveUxSmall -OutputDirectory "$proof/compact" } catch { $failed += $_.Exception.Message; Write-Host $_.Exception.Message }
          if ($failed.Count) { throw ("Native QA failures: " + ($failed -join "; ")) }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-wpf-proof
          path: ${{ runner.temp }}/windows-proof/
          if-no-files-found: warn

  publish-preview:
    if: startsWith(github.event.head_commit.message, 'Release v1.9.0-preview.')
    needs: [build, linux-native, windows-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: touchtyping-numbered-preview-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - id: download_candidate
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: live-verified-archives
          path: ${{ runner.temp }}/publication
      # Artifact indexing can lag behind the successful upload job.
      - if: steps.download_candidate.outcome == 'failure'
        shell: bash
        run: sleep 15
      - if: steps.download_candidate.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: live-verified-archives
          path: ${{ runner.temp }}/publication
      - name: Publish and redownload the verified archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/preview-publish.sh "$RUNNER_TEMP/publication"
