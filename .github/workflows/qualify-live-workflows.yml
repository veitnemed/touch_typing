name: Qualify TouchTyping archives and publish explicit previews
on:
  push:
    branches: [feature/live-ux-acceptance]
permissions:
  contents: read
env:
  PRODUCT_SHA: "${{ github.sha }}"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and archive the two release candidates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          p="$RUNNER_TEMP/live-workflows"
          mkdir -p "$p"
          bash linux/build-release.sh "$p/touch-typing-linux-x64"
          bash windows/build-release.sh "$p/windows-x64"
          tar --sort=name --mtime='UTC 2026-11-25' --owner=0 --group=0 --numeric-owner -czf "$p/touch-typing-candidate-linux-x64.tar.gz" -C "$p" touch-typing-linux-x64
          (cd "$p/windows-x64" && zip -qr "$p/touch-typing-candidate-windows-x64.zip" .)
          (cd "$p" && sha256sum touch-typing-candidate-* > SHA256SUMS.txt)
          printf '%s\n' "$PRODUCT_SHA" > "$p/SOURCE-SHA.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: live-verified-archives
          path: |
            ${{ runner.temp }}/live-workflows/touch-typing-candidate-*
            ${{ runner.temp }}/live-workflows/SHA256SUMS.txt
            ${{ runner.temp }}/live-workflows/SOURCE-SHA.txt
          if-no-files-found: error
  engine-regression:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - id: download_engine_candidate
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: live-verified-archives
          path: ${{ runner.temp }}/live-workflows
      - if: steps.download_engine_candidate.outcome == 'failure'
        shell: bash
        run: sleep 15
      - if: steps.download_engine_candidate.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: live-verified-archives
          path: ${{ runner.temp }}/live-workflows
      - name: Cross-check engine and catalog against the exact archived binary
        shell: bash
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/live-workflows"
          test "$(cat "$p/SOURCE-SHA.txt")" = "$PRODUCT_SHA"
          (cd "$p" && sha256sum -c SHA256SUMS.txt)
          tar -xzf "$p/touch-typing-candidate-linux-x64.tar.gz" -C "$p"
          for suite in SharedRegression LabRegression TerminalRegression LabStressTests NotebookKernelRegression; do
            dotnet run --project "linux/tests/$suite.csproj" -c Release
          done
          export PYTHONPATH="$PWD/linux" TOUCH_TYPING_ENGINE="$p/touch-typing-linux-x64/engine/TouchTyping.Engine"
          /usr/bin/python3 linux/tests/test_practice.py
          /usr/bin/python3 linux/tests/test_classic_cycles.py
          /usr/bin/python3 linux/tests/test_mixed_typing.py
          /usr/bin/python3 linux/tests/test_typing_mode_records.py
          /usr/bin/python3 linux/tests/test_active_keyboard_layout.py
          /usr/bin/python3 linux/tests/test_live_entry_preferences.py
          /usr/bin/python3 linux/tests/test_live_missions.py
          /usr/bin/python3 linux/tests/test_live_catalog_contract.py
          /usr/bin/python3 linux/tests/test_live_route_policy.py
          /usr/bin/python3 linux/tests/test_live_coach.py
          /usr/bin/python3 linux/tests/audit_live_course_rotation.py --baseline qa/fixtures/live-course-f905eb4-missions.json
          /usr/bin/python3 linux/tests/test_editor_course.py
          /usr/bin/python3 linux/tests/test_editor_notebooks.py
          /usr/bin/python3 linux/tests/test_notebook_workspace.py
          /usr/bin/python3 linux/tests/test_notebook_advanced_routes.py
          /usr/bin/python3 linux/tests/test_source_handoff.py
          /usr/bin/python3 linux/tests/test_project_file_practice.py
          /usr/bin/python3 linux/tests/test_win10_protocol.py "$TOUCH_TYPING_ENGINE"
          /usr/bin/python3 linux/tests/audit_live_shortcuts.py
  linux-native:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: download_candidate
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: live-verified-archives
          path: ${{ runner.temp }}/archives
      # Artifact indexing can lag behind the successful upload job.
      - if: steps.download_candidate.outcome == 'failure'
        shell: bash
        run: sleep 15
      - if: steps.download_candidate.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: live-verified-archives
          path: ${{ runner.temp }}/archives
      - name: Run installed GTK from the actual archive on a clean X11 profile
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth ffmpeg x11-xkb-utils gir1.2-gtk-4.0 python3-gi python3-cairo python3-gi-cairo libxtst6 libglib2.0-bin
          p="$RUNNER_TEMP/archives"
          (cd "$p" && sha256sum -c SHA256SUMS.txt)
          temp=$(mktemp -d)
          tar -xzf "$p/touch-typing-candidate-linux-x64.tar.gz" -C "$temp"
          package="$temp/touch-typing-linux-x64"
          # Exercise the package's separate install path as an ordinary user
          # without replacing a runner profile or any real launcher.
          mkdir -p "$temp/install home" "$temp/install-config"
          (export HOME="$temp/install home" XDG_DATA_HOME="$temp/installed" XDG_CONFIG_HOME="$temp/install-config"
           bash "$package/install.sh"
           test -s "$XDG_DATA_HOME/applications/com.veitnemed.TouchTyping.desktop"
           test "$(find "$XDG_DATA_HOME/touch-typing/releases" -name lab_explorer.py -type f | wc -l)" -eq 1)
          export TOUCH_TYPING_QA_OUTPUT="$RUNNER_TEMP/gtk-proof" TOUCH_TYPING_ENGINE="$package/engine/TouchTyping.Engine"
          export XDG_DATA_HOME="$temp/data" XDG_RUNTIME_DIR="$temp/runtime" TOUCH_TYPING_QA_DATA_ROOT="$temp/profile"
          mkdir -p -m 700 "$TOUCH_TYPING_QA_OUTPUT" "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR" "$TOUCH_TYPING_QA_DATA_ROOT"
          export PYTHONPATH="$package:$PWD/linux/tests" GDK_BACKEND=x11 GTK_A11Y=none GSK_RENDERER=cairo GSETTINGS_BACKEND=memory
          /usr/bin/python3 linux/tests/test_x11_physical_keyboard.py
          timeout 150s xvfb-run -a -s "-screen 0 1024x600x24 -nolisten tcp" bash -c '
            set -e
            ffmpeg -y -loglevel warning -f x11grab -framerate 15 -video_size 1024x600 -i "$DISPLAY" -c:v libx264 -preset fast -crf 25 -pix_fmt yuv420p "$TOUCH_TYPING_QA_OUTPUT/gtk-workflow.mp4" &
            video=$!
            trap "kill -INT $video 2>/dev/null || true; wait $video || true" EXIT
            /usr/bin/python3 linux/tests/test_preview2_native.py
          ' | tee "$TOUCH_TYPING_QA_OUTPUT/gtk-test.log"
          native_failures=()
          for scenario in test_editor_notebooks_x11.py test_project_files_x11.py test_editor_course_x11.py test_typing_cycles_native.py test_typing_records_gtk.py test_typing_mixed_native.py test_live_guide_layout_native.py test_live_course_cards_x11.py test_notebook_workbench_native.py test_source_handoff_x11.py test_source_handoff_x11.py:course test_live_coach_x11.py test_notebook_file_handoff_x11.py; do
            script="${scenario%%:*}"
            proof_name="${script%.py}"
            unset TOUCH_TYPING_QA_SOURCE_MODE
            if [[ $scenario == *:course ]]; then
              proof_name="$proof_name-course"
              export TOUCH_TYPING_QA_SOURCE_MODE=course
            fi
            export TOUCH_TYPING_QA_OUTPUT="$RUNNER_TEMP/gtk-proof/$proof_name" TOUCH_TYPING_QA_DATA_ROOT="$temp/$proof_name"
            mkdir -m 700 "$TOUCH_TYPING_QA_OUTPUT" "$TOUCH_TYPING_QA_DATA_ROOT"
            export SCENARIO="$script" TOUCH_TYPING_QA_VIDEO=1
            if ! timeout 180s xvfb-run -a -s "-screen 0 1024x600x24 -nolisten tcp" bash -c '
              set -e
              printf "VIDEO_BASE %s %s\n" "$SCENARIO" "$(date +%s.%N)"
              ffmpeg -y -loglevel warning -f x11grab -framerate 15 -video_size 1024x600 -i "$DISPLAY" \
                -c:v libx264 -preset fast -crf 25 -pix_fmt yuv420p "$TOUCH_TYPING_QA_OUTPUT/session.mp4" &
              video=$!
              trap "kill -INT $video 2>/dev/null || true; wait $video || true" EXIT
              case "$SCENARIO" in
                test_typing_*) dbus-run-session -- /usr/bin/python3 "linux/tests/$SCENARIO";;
                *) /usr/bin/python3 "linux/tests/$SCENARIO";;
              esac
            ' | tee "$TOUCH_TYPING_QA_OUTPUT/gtk-test.log"; then
              native_failures+=("$proof_name")
            fi
          done
          export TOUCH_TYPING_QA_OUTPUT="$RUNNER_TEMP/gtk-proof"
          unset TOUCH_TYPING_QA_DATA_ROOT
          export XDG_DATA_HOME="$temp/repeat-data"
          mkdir -p -m 700 "$XDG_DATA_HOME"
          timeout 40s xvfb-run -a -s "-screen 0 1024x600x24 -nolisten tcp" bash -c '
            set -eu
            export TOUCH_TYPING_QA_XVFB_PID="$(pgrep -f "^Xvfb $DISPLAY " | head -n 1)"
            test -n "$TOUCH_TYPING_QA_XVFB_PID"
            /usr/bin/python3 linux/tests/test_live_backspace_x11.py
          ' | tee "$TOUCH_TYPING_QA_OUTPUT/gtk-backspace.log"
          for rules in base evdev; do
            export TOUCH_TYPING_QA_XKB_RULES="$rules" TOUCH_TYPING_QA_OUTPUT="$RUNNER_TEMP/gtk-proof/xkb-$rules"
            export TOUCH_TYPING_QA_DATA_ROOT="$temp/xkb-profile-$rules" XDG_DATA_HOME="$temp/xkb-data-$rules"
            mkdir -m 700 "$TOUCH_TYPING_QA_OUTPUT" "$TOUCH_TYPING_QA_DATA_ROOT" "$XDG_DATA_HOME"
            if ! timeout 60s xvfb-run -a -s "-screen 0 1024x600x24 -nolisten tcp -noreset" bash -c '
              set -e
              setxkbmap -rules "$TOUCH_TYPING_QA_XKB_RULES" -model pc105 -layout us,ru
              dbus-run-session -- /usr/bin/python3 linux/tests/test_x11_physical_keyboard_native.py
            ' | tee "$TOUCH_TYPING_QA_OUTPUT/gtk-test.log"; then
              native_failures+=("xkb-$rules")
            fi
          done
          if (( ${#native_failures[@]} )); then
            printf 'Native GTK failures: %s\n' "${native_failures[*]}" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-gtk-proof
          path: ${{ runner.temp }}/gtk-proof/
          if-no-files-found: warn
  windows-native:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: download_candidate
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: live-verified-archives
          path: ${{ runner.temp }}/archives
      # Artifact indexing can lag behind the successful upload job.
      - if: steps.download_candidate.outcome == 'failure'
        shell: bash
        run: sleep 15
      - if: steps.download_candidate.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: live-verified-archives
          path: ${{ runner.temp }}/archives
      - name: Verify and run the extracted WPF application
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "$($os.Caption) $($os.BuildNumber) $env:RUNNER_ARCH"
          $pkg = "$env:RUNNER_TEMP/archives"
          if ((Get-Content "$pkg/SOURCE-SHA.txt" -Raw).Trim() -ne $env:PRODUCT_SHA) { throw 'Source mismatch' }
          $zip = "$pkg/touch-typing-candidate-windows-x64.zip"
          $hash = ((Get-Content "$pkg/SHA256SUMS.txt" | Where-Object { $_ -match 'windows-x64\.zip$' }) -split '\s+')[0]
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $hash) { throw 'Archive mismatch' }
          $app = "$env:RUNNER_TEMP/TouchTyping Live Candidate"
          Expand-Archive -LiteralPath $zip -DestinationPath $app
          $proof = "$env:RUNNER_TEMP/windows-proof"
          & "./windows/Test-Typing-Session.ps1" -Application "$app/TouchTyping.exe" -OutputDirectory "$proof/typing-session"
          & "./windows/Test-TypingCardRecords.ps1" -Application "$app/TouchTyping.exe" -OutputDirectory "$proof/typing-records"
          & "./windows/Test-Typing-Mixed.ps1" -Application "$app/TouchTyping.exe" -OutputDirectory "$proof/typing-mixed"
          & "$app/Test-Live-UI.ps1" -Application "$app/TouchTyping.exe" -NativeLayout -Seed 0 -OutputDirectory "$proof/live-layout"
          & "$app/Test-Live-UI.ps1" -Application "$app/TouchTyping.exe" -NotebookMission -Seed 0 -OutputDirectory "$proof/notebook"
          & "$app/Test-Live-UI.ps1" -Application "$app/TouchTyping.exe" -ProjectFileMission -Seed 0 -OutputDirectory "$proof/project-files"
          & "$app/Test-Live-UI.ps1" -Application "$app/TouchTyping.exe" -EditorProjectFileMission -Seed 0 -OutputDirectory "$proof/editor-project-files"
          & "$app/Test-Live-UI.ps1" -Application "$app/TouchTyping.exe" -EditorCourse -Seed 0 -OutputDirectory "$proof/editor-course"
          & "$app/Test-Live-UI.ps1" -Application "$app/TouchTyping.exe" -BrowserClone -Seed 0 -OutputDirectory "$proof/browser"
          & "$app/Test-Live-UI.ps1" -Application "$app/TouchTyping.exe" -WorkdayNumLock off -Seed 0 -OutputDirectory "$proof/keypad-off"
          & "$app/Test-Live-UI.ps1" -Application "$app/TouchTyping.exe" -WorkdayNumLock on -Seed 0 -OutputDirectory "$proof/keypad-on"
          & "$app/Test-Live-UI.ps1" -Application "$app/TouchTyping.exe" -WorkdayNumLock dedicated -Seed 0 -OutputDirectory "$proof/dedicated-home"
          & "$app/Test-Live-UI.ps1" -Application "$app/TouchTyping.exe" -LiveUxSmall -OutputDirectory "$proof/compact"
          & "./windows/Test-LiveCourseCards.ps1" -Application "$app/TouchTyping.exe" -OutputDirectory "$proof/course-cards"
          & "./windows/Test-LiveSourceHandoffs.ps1" -Application "$app/TouchTyping.exe" -OutputDirectory "$proof/source-handoffs"
          & "./windows/Test-Notebook-Workbench.ps1" -Application "$app/TouchTyping.exe" -OutputDirectory "$proof/notebook-workbench"
          & "./windows/Test-Notebook-File-Handoff.ps1" -Application "$app/TouchTyping.exe" -OutputDirectory "$proof/notebook-file-handoff"
      - name: Verify visible adaptive guidance in two ordinary Chrome routes
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $app = "$env:RUNNER_TEMP/TouchTyping Live Candidate"
          $proof = "$env:RUNNER_TEMP/windows-proof"
          $problems = @()
          try { & "$app/Test-Live-UI.ps1" -Application "$app/TouchTyping.exe" -LiveCoach -Seed 0 -OutputDirectory "$proof/live-coach" }
          catch { $problems += "Blind: $_" }
          try { & "$app/Test-Live-UI.ps1" -Application "$app/TouchTyping.exe" -LiveCoachHint -Seed 0 -OutputDirectory "$proof/live-coach-hint" }
          catch { $problems += "Hint: $_" }
          if ($problems.Count) { throw ($problems -join '; ') }
      - name: Render editor at 96, 120 and 144 DPI and verify rasterized selection
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $app = "$env:RUNNER_TEMP/TouchTyping Live Candidate"
          $proof = "$env:RUNNER_TEMP/windows-proof"
          $render = "$proof/editor-dpi"
          $previousRoot = $env:TOUCH_TYPING_QA_DATA_ROOT
          $env:TOUCH_TYPING_QA_DATA_ROOT = "$proof/editor-dpi-profile"
          try {
            $renderCheck = Start-Process -FilePath "$app/TouchTyping.exe" -ArgumentList ('--qa --check-live-render "{0}"' -f $render) -WorkingDirectory $app -Wait -PassThru
            Get-Content "$render/result.txt"
            if ($renderCheck.ExitCode -ne 0) { throw "WPF render proof failed ($($renderCheck.ExitCode))" }
          } finally { $env:TOUCH_TYPING_QA_DATA_ROOT = $previousRoot }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-wpf-proof
          path: ${{ runner.temp }}/windows-proof/
          if-no-files-found: warn

  publish-preview:
    if: startsWith(github.event.head_commit.message, 'Release v1.9.0-preview.')
    needs: [build, engine-regression, linux-native, windows-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: touchtyping-numbered-preview-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - id: download_candidate
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: live-verified-archives
          path: ${{ runner.temp }}/publication
      # Artifact indexing can lag behind the successful upload job.
      - if: steps.download_candidate.outcome == 'failure'
        shell: bash
        run: sleep 15
      - if: steps.download_candidate.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: live-verified-archives
          path: ${{ runner.temp }}/publication
      - name: Publish and redownload the verified archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/preview-publish.sh "$RUNNER_TEMP/publication"
