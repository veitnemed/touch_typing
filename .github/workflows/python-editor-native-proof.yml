name: Capture the packaged Python editor on Windows

on:
  push:
    branches: [feature/github-dark-python]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-editor-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run lexical and exact edit acceptance, then package this source
        run: |
          set -euo pipefail
          dotnet run --project linux/tests/highlight/PythonHighlightRegression.csproj -c Release
          dotnet build linux/engine/TouchTyping.Engine.csproj -c Release
          export TOUCH_TYPING_ENGINE="$GITHUB_WORKSPACE/linux/engine/bin/Release/net10.0/TouchTyping.Engine"
          export PYTHONPATH="$GITHUB_WORKSPACE/linux"
          /usr/bin/python3 linux/tests/test_python_editor.py
          /usr/bin/python3 linux/tests/test_neutral_project.py
          bash windows/build-release.sh "$RUNNER_TEMP/editor-package"
          (cd "$RUNNER_TEMP/editor-package" && zip -qr "$RUNNER_TEMP/touchtyping-python-editor.zip" .)
          (cd "$RUNNER_TEMP" && sha256sum touchtyping-python-editor.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: python-editor-windows-candidate
          path: |
            ${{ runner.temp }}/touchtyping-python-editor.zip
            ${{ runner.temp }}/SHA256SUMS.txt
  native-wpf:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-editor-windows-candidate
          path: ${{ runner.temp }}/editor-candidate
      - name: Verify exact package and exercise the real WPF editor
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:RUNNER_TEMP 'editor-candidate'
          $zip = Join-Path $candidate 'touchtyping-python-editor.zip'
          $expected = (Get-Content (Join-Path $candidate 'SHA256SUMS.txt') -Raw).Split(' ')[0]
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $expected) { throw 'ZIP SHA mismatch' }
          $appDir = Join-Path $env:RUNNER_TEMP 'Editor comparison app'
          Expand-Archive -LiteralPath $zip -DestinationPath $appDir
          $env:TOUCH_TYPING_QA_LESSON_CHROME = 'compact'
          $out = Join-Path $env:RUNNER_TEMP 'wpf-editor-evidence'
          Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsBuildNumber,OsArchitecture
          & (Join-Path $env:GITHUB_WORKSPACE 'windows/Capture-HomeReference.ps1') `
            -Application (Join-Path $appDir 'TouchTyping.exe') -CodeTheme -AdjustHostedDisplay `
            -ClientWidth 1366 -ClientHeight 768 -OutputDirectory $out
          $frames = Join-Path $out 'native-reference-evidence'
          foreach ($file in @('editor-theme-03-add-task-selected.png','editor-theme-03-add-task-selected-viewport.png')) {
            if (-not (Test-Path -LiteralPath (Join-Path $frames $file) -PathType Leaf)) { throw "Missing native frame $file" }
          }
      - name: Practice both Python missions and neutral-project navigation in native WPF
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $appDir = Join-Path $env:RUNNER_TEMP 'Editor comparison app'
          $app = Join-Path $appDir 'TouchTyping.exe'
          $env:TOUCH_TYPING_QA_LESSON_CHROME = 'compact'
          $out = Join-Path $env:RUNNER_TEMP 'wpf-python-missions-evidence'
          & (Join-Path $appDir 'Test-Live-UI.ps1') -Application $app -PythonEditor -OutputDirectory $out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wpf-python-editor-evidence
          path: |
            ${{ runner.temp }}/wpf-editor-evidence/native-reference-evidence/*.png
            ${{ runner.temp }}/wpf-editor-evidence/*.log
            ${{ runner.temp }}/wpf-editor-evidence/report.json
            ${{ runner.temp }}/wpf-python-missions-evidence/native-reference-evidence/*.png
            ${{ runner.temp }}/wpf-python-missions-evidence/*.log
            ${{ runner.temp }}/wpf-python-missions-evidence/report.json
          if-no-files-found: warn
