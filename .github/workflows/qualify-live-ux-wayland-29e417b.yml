name: Qualify exact Live UX on GNOME Wayland (no publish)
on:
  push:
    branches: [qa/live-ux-wayland-29e417b]
permissions:
  contents: read
jobs:
  ubuntu-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 29e417b2cb547bfeffbcea271def339e787dbc5d
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build the Linux archive from exact product SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '29e417b2cb547bfeffbcea271def339e787dbc5d'
          mkdir -p "$RUNNER_TEMP/live-qa/verified" "$RUNNER_TEMP/live-wayland-evidence"
          bash linux/build-release.sh "$RUNNER_TEMP/live-qa/verified/touch-typing-linux-x64"
          cd "$RUNNER_TEMP/live-qa/verified"
          tar -czf touch-typing-live-29e417b-linux-x64.tar.gz touch-typing-linux-x64
          sha256sum touch-typing-live-29e417b-linux-x64.tar.gz | tee "$RUNNER_TEMP/live-wayland-evidence/SHA256SUMS.txt"
          printf '%s\n' '29e417b2cb547bfeffbcea271def339e787dbc5d' > "$RUNNER_TEMP/live-wayland-evidence/product-sha.txt"
      - name: Install GNOME and GTK test-session dependencies
        shell: bash
        run: |
          set -euo pipefail
          sources="$RUNNER_TEMP/win10-noble-sources.list"
          cat > "$sources" <<'APT'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu/ noble main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu/ noble-updates main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu/ noble-security main universe
          APT
          options=(
            -o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=-
            -o Acquire::Retries=2 -o Acquire::https::Timeout=25 -o Acquire::http::Timeout=25 )
          pkgs=(gnome-shell gsettings-desktop-schemas gir1.2-gtk-4.0 python3-gi
                python3-gi-cairo python3-cairo dbus-x11 fonts-dejavu-core libgl1-mesa-dri)
          sudo timeout --kill-after=15s 180s apt-get "${options[@]}" -o APT::Update::Error-Mode=any update
          sudo timeout --kill-after=15s 540s apt-get "${options[@]}" -y --download-only --no-install-recommends install "${pkgs[@]}"
          sudo timeout --kill-after=15s 300s apt-get "${options[@]}" -y --no-download --no-install-recommends install "${pkgs[@]}"
          gnome-shell --version
          /usr/bin/python3 -c 'import gi; gi.require_version("Gtk","4.0"); from gi.repository import Gtk; print("GTK", Gtk.get_major_version(), Gtk.get_minor_version())'
      - name: Verify real GTK Wayland keyboard and pointer Live flow
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/live-qa/verified"
          proof="$RUNNER_TEMP/live-wayland-evidence"
          cd "$pkg"
          sha256sum -c "$proof/SHA256SUMS.txt"
          mkdir "$RUNNER_TEMP/live-qa/runtime"
          tar -xzf touch-typing-live-29e417b-linux-x64.tar.gz -C "$RUNNER_TEMP/live-qa/runtime"
          cd "$RUNNER_TEMP/live-qa/runtime/touch-typing-linux-x64"
          sha256sum touch_typing.py style.css lab_view.py platform_linux.py engine/TouchTyping.Engine.dll > "$proof/runtime-SHA256SUMS.txt"
