name: Prove real Chrome history input and appearance (QA, no publication)
on:
  push:
    branches: [qa/touchtyping-chrome-history]
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - run: |
          set -euo pipefail
          p="$RUNNER_TEMP/chrome-pack"
          mkdir -p "$p"
          bash windows/build-release.sh "$p/windows"
          (cd "$p/windows" && zip -qr "$p/chrome-windows-x64.zip" .)
          (cd "$p" && sha256sum chrome-windows-x64.zip > SHA256SUMS.txt)
          git rev-parse HEAD >"$p/SOURCE-SHA.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-wpf-archive
          path: |
            ${{ runner.temp }}/chrome-pack/chrome-windows-x64.zip
            ${{ runner.temp }}/chrome-pack/SHA256SUMS.txt
            ${{ runner.temp }}/chrome-pack/SOURCE-SHA.txt
  windows-native:
    runs-on: windows-2025
    needs: pack
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: chrome-wpf-archive
          path: ${{ runner.temp }}/chrome-pack
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p = "$env:RUNNER_TEMP/chrome-pack"
          if ((Get-Content "$p/SOURCE-SHA.txt" -Raw).Trim() -ne $env:GITHUB_SHA) { throw 'Source mismatch' }
          $zip = "$p/chrome-windows-x64.zip"
          $hash = ((Get-Content "$p/SHA256SUMS.txt" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $hash) { throw 'SHA256 mismatch' }
          $app = "$env:RUNNER_TEMP/TouchTyping Chrome Candidate"
          $out = "$env:RUNNER_TEMP/chrome-wpf-proof"
          Expand-Archive "$zip" -DestinationPath $app
          $failures = @()
          try { & "./windows/Test-ChromeHistory.ps1" -Application "$app/TouchTyping.exe" -OutputDirectory "$out/history" }
          catch { $failures += "Keyboard/actual result: $_" }
          try { & "./windows/Test-Chrome-History-View.ps1" -Application "$app/TouchTyping.exe" -OutputDirectory "$out/visual" }
          catch { $failures += "Native pixels/actual state: $_" }
          if($failures.Count) { throw ($failures -join '; ') }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chrome-wpf-proof
          path: ${{ runner.temp }}/chrome-wpf-proof/
