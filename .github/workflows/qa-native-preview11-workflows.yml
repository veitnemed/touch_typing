name: Check the actual Preview 11 Windows archive bilingual note (QA only)
on:
  push:
    branches: [qa/touchtyping-new-workflows-11]
permissions:
  contents: read
  actions: read
jobs:
  windows-native:
    runs-on: windows-2025
    timeout-minutes: 8
    env:
      CANDIDATE_SHA: cf2b0c0208c8f7dd6c5ed77f9da6594d1b48e687
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: live-verified-archives
          run-id: 45592901335
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/note-archive
      - shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p = "$env:RUNNER_TEMP/note-archive"
          if ((Get-Content "$p/SOURCE-SHA.txt" -Raw).Trim() -ne $env:CANDIDATE_SHA) { throw 'Source mismatch' }
          $zip = "$p/touch-typing-candidate-windows-x64.zip"
          $hash = ((Get-Content "$p/SHA256SUMS.txt" | Where-Object { $_ -match 'windows-x64\.zip$' }) -split '\s+')[0]
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $hash) { throw 'SHA256 mismatch' }
          $app = "$env:RUNNER_TEMP/TouchTyping Live Candidate"
          $out = "$env:RUNNER_TEMP/work-note-proof"
          Expand-Archive -LiteralPath $zip -DestinationPath $app
          & "./windows/Test-Typing-Work-Note.ps1" -Application "$app/TouchTyping.exe" -OutputDirectory $out
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: typing-work-note-wpf-proof, path: "${{ runner.temp }}/work-note-proof/"}
