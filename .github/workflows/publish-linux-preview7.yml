name: Publish TouchTyping Linux preview
on:
  push:
    branches: [release/v1.8.0-preview.7-linux]
permissions:
  actions: read
  contents: write
concurrency:
  group: touchtyping-v180-preview-7-linux
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: '444892cfcc750af678e6c88835f05cfc758bc7f8'
      RUN: '45203040860'
      QA_SHA: '05d6df4c6a0d8ec96b4936f884f68b77147c4658'
      LINUX_SHA256: '80e46c66823d9bf3d8aa508748af027ef7d5ddb03e0289836529183eeff5eb65'
      CANDIDATE_BRANCH: 'qa/linux-python-444892c'
      REPO: 'veitnemed/touch_typing'
      TAG: 'v1.8.0-preview.7'
    steps:
      - name: Verify Linux checks, artifact, and absence of Windows assets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN" =~ ^[0-9]+$ && "$LINUX_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo 'Exact hosted Linux run ID and tar SHA-256 required; refusing publication'; exit 1;
          }
          gh api "repos/$REPO/actions/runs/$RUN" | jq -e --arg sha "$QA_SHA" --arg branch "$CANDIDATE_BRANCH" '
            .head_sha == $sha and .head_branch == $branch and .status == "completed" and .conclusion == "success"
            and .path == ".github/workflows/qualify-linux-444.yml"' >/dev/null
          gh api "repos/$REPO/actions/runs/$RUN/jobs?per_page=50" | jq -e '
            .jobs as $j | ["linux-package","linux-window"] |
            all(. as $name | any($j[]; .name==$name and .conclusion=="success")) and
            any($j[]; .name=="linux-window" and any(.steps[]; .name=="Send keys through isolated GNOME Wayland to the packaged GTK window" and .conclusion=="success"))' >/dev/null
          gh api "repos/$REPO/actions/runs/$RUN/artifacts?per_page=100" | jq -e '
            [.artifacts[] | select(.name=="linux-x64-candidate" and .expired==false)]
            | length==1' >/dev/null
          mkdir -p "$RUNNER_TEMP/preview"
          cd "$RUNNER_TEMP/preview"
          gh run download "$RUN" --repo "$REPO" --name linux-x64-candidate --dir .
          sha256sum -c SHA256SUMS.txt
          echo "$LINUX_SHA256  touch-typing-linux-x64.tar.gz" | sha256sum -c
          tar -tzf touch-typing-linux-x64.tar.gz > files.txt
          if grep -vE '^touch-typing-linux-x64(/|$)' files.txt || grep -E '(^|/)\.\.(/|$)' files.txt; then
            echo 'Unexpected path in archive'; exit 1
          fi
          grep -Fx 'touch-typing-linux-x64/install.sh' files.txt
          grep -Fx 'touch-typing-linux-x64/engine/TouchTyping.Engine' files.txt
          for asset in Roboto-Regular.ttf Roboto-Medium.ttf Roboto-Bold.ttf OFL.txt ROBOTO-SOURCE.txt; do
            grep -Fx "touch-typing-linux-x64/fonts/$asset" files.txt
          done
          if grep -Ei '\.exe$' files.txt; then echo 'Unexpected Windows executable'; exit 1; fi
          if grep -Ei '(^|/)(\.env(\.|$)|\.git(/|$)|progress\.xml($|[.~])|.*\.(pem|pfx|p12|key)$|profiles?/|secrets?/|credentials($|\.))' files.txt; then
            echo 'Potential private profile/secret found in archive'; exit 1
          fi
          mv touch-typing-linux-x64.tar.gz "touch-typing-$TAG-linux-x64.tar.gz"
          sha256sum "touch-typing-$TAG-linux-x64.tar.gz" > SHA256SUMS.txt
          cat > notes.md <<'NOTES'
          Отдельный предварительный выпуск для Linux x86-64, без EXE. Распакуйте архив и выполните `bash install.sh` внутри папки. Нужны GTK 4, Python 3, PyGObject и Cairo.

          - **Редактор Python:** подсветка в стиле GitHub Dark, редактирование реального учебного исходника и переход к объявлению.
          - **Поиск в файле:** три совпадения, переходы вперёд и назад, исправление только второго, F12 и возврат на прежнее место.
          - **Нейтральный проект:** упражнения используют учебный Python-проект, а не исходники самого тренажёра.

          Поведение редактора отдельно проверено в упакованном GTK-приложении того же коммита в изолированном X11. На архиве этого выпуска в изолированном GNOME Wayland проверена новая миссия поиска: из трёх совпадений меняется только нужное, после F12 возврат восстанавливает каретку. Физическая клавиатура MateBook и Windows в этот выпуск не входят.
          NOTES
          printf '\nАрхив без пересборки: [проверенный прогон](https://github.com/%s/actions/runs/%s), коммит `%s`.\n' \
            "$REPO" "$RUN" "$CANDIDATE_SHA" >> notes.md
          gh release create "$TAG" --repo "$REPO" --target "$CANDIDATE_SHA" --prerelease --latest=false \
            --title "TouchTyping $TAG для Linux: редактор Python" --notes-file notes.md \
            "touch-typing-$TAG-linux-x64.tar.gz" SHA256SUMS.txt
