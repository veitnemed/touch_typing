name: Publish TouchTyping Linux preview
on:
  push:
    branches: [release/v1.8.0-preview.6-linux]
permissions:
  actions: read
  contents: write
concurrency:
  group: touchtyping-v180-preview-6-linux
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: '845766c8d82793228da9af808c45c7b1f6aab767'
      RUN: '45141943599'
      LINUX_SHA256: 'd0df079f038cf0605015a3ec91529598688d5620b32a288db43976a13492fa14'
      REPO: 'veitnemed/touch_typing'
      TAG: 'v1.8.0-preview.6'
    steps:
      - name: Verify Linux checks, artifact, and absence of Windows assets
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$RUN" | jq -e --arg sha "$CANDIDATE_SHA" '
            .head_sha == $sha and .head_branch == "feature/reference-ui"
            and .path == ".github/workflows/live-input-candidate.yml"' >/dev/null
          gh api "repos/$REPO/actions/runs/$RUN/jobs?per_page=50" | jq -e '
            .jobs as $j | ["engine","linux-window"] |
            all(. as $name | any($j[]; .name==$name and .conclusion=="success")) and
            any($j[]; .name=="linux-window" and any(.steps[]; .name=="Send keys through isolated GNOME Wayland to the packaged GTK window" and .conclusion=="success"))' >/dev/null
          mkdir -p "$RUNNER_TEMP/preview"
          cd "$RUNNER_TEMP/preview"
          gh run download "$RUN" --repo "$REPO" --name linux-x64-candidate --dir .
          echo "$LINUX_SHA256  touch-typing-linux-x64.tar.gz" | sha256sum -c
          tar -tzf touch-typing-linux-x64.tar.gz > files.txt
          grep -Fx 'touch-typing-linux-x64/install.sh' files.txt
          grep -Fx 'touch-typing-linux-x64/engine/TouchTyping.Engine' files.txt
          for asset in Roboto-Regular.ttf Roboto-Medium.ttf Roboto-Bold.ttf OFL.txt ROBOTO-SOURCE.txt; do
            grep -Fx "touch-typing-linux-x64/fonts/$asset" files.txt
          done
          if grep -Ei '\.exe$' files.txt; then echo 'Unexpected Windows executable'; exit 1; fi
          if grep -Ei '(^|/)(\.env(\.|$)|\.git(/|$)|progress\.xml($|[.~])|.*\.(pem|pfx|p12|key)$|profiles?/|secrets?/|credentials($|\.))' files.txt; then
            echo 'Potential private profile/secret found in archive'; exit 1
          fi
          mv touch-typing-linux-x64.tar.gz "touch-typing-$TAG-linux-x64.tar.gz"
          sha256sum "touch-typing-$TAG-linux-x64.tar.gz" > SHA256SUMS.txt
          cat > notes.md <<'NOTES'
          Отдельный выпуск для Linux x86-64, без EXE. Распакуйте архив, откройте распакованную папку и выполните `bash install.sh`. Нужны GTK 4, Python 3, PyGObject и Cairo.
          
          Проверены реальное окно GTK в изолированной Ubuntu 24.04 / GNOME Wayland, оба профиля сочетаний GNOME и обе миссии отладки. Физическая клавиатура MateBook не использовалась. Миграция профиля с опубликованной v1.7.0 отдельно проверена на Linux: прогресс и настройки сохранились, повторный запуск не задвоил результаты.
          
          ### Что нового относительно preview.5
          
          - **VS Code:** поиск по фрагменту сообщения об ошибке теперь ведёт к нужной строке. Отдельная миссия: перейти к проблеме, выбрать исправление и запустить относящийся к нему учебный тест. Зачёт требует сохранённой правки и правильного результата, а не просто открытия панели.
          - **Ubuntu / GNOME:** перенос терминала на другой рабочий стол и возврат к коду, выбор между окнами одного приложения, отдельная практика левой Super и переключения раскладки для MateBook.
          - **«Разобрать ошибку без мыши»:** два разных проекта, с подсказками и самостоятельно. Найдите вызов, сверитесь со справкой, исправьте исходник, запустите профильный тест и приложите в отчёт снимок только учебного терминала. На компьютере пользователя учебный код не исполняется.
          
          Это предварительный выпуск, не полная приёмка всех функций.
          
          Сборка без пересборки из [прошедшего прогона](https://github.com/veitnemed/touch_typing/actions/runs/45141943599) на `845766c8d82793228da9af808c45c7b1f6aab767`.
          NOTES
          gh release create "$TAG" --repo "$REPO" --target "$CANDIDATE_SHA" --prerelease --latest=false \
            --title "TouchTyping $TAG для Linux: отладка без мыши" --notes-file notes.md \
            "touch-typing-$TAG-linux-x64.tar.gz" SHA256SUMS.txt
