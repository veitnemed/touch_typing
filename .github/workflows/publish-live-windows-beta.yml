name: Publish TouchTyping Windows x64 beta
on:
  push:
    branches: [release/v1.8.0-preview.3-windows-beta]
permissions:
  actions: read
  contents: write
concurrency:
  group: touchtyping-windows-beta-preview-3
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: 'c24d21fa5a990946ad6f29e480dfb49c537a26c9'
      RUN: '45116054674'
      WINDOWS_SHA256: 'a2b1db74d27059477af1ecdeef02df7cdce691add2b3a489fe5af451a6af60e2'
      REPO: 'veitnemed/touch_typing'
      TAG: 'v1.8.0-preview.3-windows-beta'
    steps:
      - name: Publish only the exact verified Windows ZIP
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$RUN" | jq -e --arg sha "$CANDIDATE_SHA" '
            .head_sha == $sha and .head_branch == "feature/reference-ui"
            and .path == ".github/workflows/live-input-candidate.yml"' >/dev/null
          gh api "repos/$REPO/actions/runs/$RUN/jobs?per_page=50" | jq -e '
            .jobs as $j | ["engine","windows-package","windows-window"] |
            all(. as $name | any($j[]; .name==$name and .conclusion=="success"))' >/dev/null
          mkdir -p "$RUNNER_TEMP/windows-beta"
          cd "$RUNNER_TEMP/windows-beta"
          gh run download "$RUN" --repo "$REPO" --name windows-x64-candidate --dir .
          sha256sum -c SHA256SUMS.txt
          echo "$WINDOWS_SHA256  touch-typing-windows-x64.zip" | sha256sum -c
          unzip -tq touch-typing-windows-x64.zip
          unzip -Z1 touch-typing-windows-x64.zip > files.txt
          grep -Fx 'Start-Live.cmd' files.txt
          grep -Fx 'TouchTyping.exe' files.txt
          for asset in Roboto-Regular.ttf Roboto-Medium.ttf Roboto-Bold.ttf OFL.txt ROBOTO-SOURCE.txt; do
            grep -Fx "fonts/$asset" files.txt
          done
          if grep -E '(^|/)progress\.xml$' files.txt; then echo 'Unexpected user profile'; exit 1; fi
          mv touch-typing-windows-x64.zip "touch-typing-$TAG-x64.zip"
          sha256sum "touch-typing-$TAG-x64.zip" > SHA256SUMS.txt
          cat > notes.md <<'NOTES'
          Отдельная бета для Windows x64. Linux-архив в этот выпуск не входит.
          
          Распакуйте ZIP целиком в отдельную папку, затем запустите `Start-Live.cmd`. Не запускайте приложение из окна архива. Сборка переносимая, без установщика. Требуется .NET Framework 4.8 или совместимая более новая версия; движок и шрифты включены.
          
          Новый главный экран, урок, пауза и результат, встроенный Roboto. Проверены реальный запуск из ZIP на Windows Server 2025 при масштабе 100%, терминал, Ctrl+L в Chrome и сквозной сценарий заметки. Клиентские Windows 10/11 и масштаб 125–150% ещё не проверены. Восстановление исходного таймера, лимита и зачётов после закрытия дорабатывается отдельно.
          
          При пробном запуске проверьте: главный экран при обычном масштабе и 125–150% (если доступно), терминал `abcde → Home → → → Delete`, и Chrome `Ctrl+L` → пауза → продолжение. При сбое полезны версия Windows, масштаб и действие, на котором он произошёл.
          NOTES
          printf '\nZIP без пересборки из [прошедшего прогона](https://github.com/%s/actions/runs/%s) на `%s`.\n' "$REPO" "$RUN" "$CANDIDATE_SHA" >> notes.md
          gh release create "$TAG" --repo "$REPO" --target "$CANDIDATE_SHA" --prerelease --latest=false \
            --title "TouchTyping v1.8.0-preview.3 — Windows x64 beta" --notes-file notes.md \
            "touch-typing-$TAG-x64.zip" SHA256SUMS.txt
