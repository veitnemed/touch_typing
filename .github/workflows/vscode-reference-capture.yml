name: Capture native official VS Code reference
on:
  push:
    branches: [qa/vscode-reference-task-list]
permissions:
  contents: read
jobs:
  official-vscode-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Prepare verified official editor, theme and isolated task-list fixture
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=2
          sudo apt-get install --no-install-recommends -y xvfb xauth x11-utils xdotool xclip openbox wmctrl imagemagick fonts-dejavu-core libgtk-3-0t64 libnss3
          work="$RUNNER_TEMP/vscode-reference"
          report="$RUNNER_TEMP/reference-evidence"
          mkdir -p "$work"/{profile/User,extensions,task-list} "$report"
          printf 'REFERENCE_WORK=%s\nREFERENCE_REPORT=%s\n' "$work" "$report" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 120 \
            'https://vscode.download.prss.microsoft.com/dbazure/download/stable/8a14f0cc1b08d531eb83255ea3764ae22aa932b5/code_1.147.0-1794903003_amd64.deb' \
            -o "$work/code.deb"
          printf '%s  %s\n' '749efcdf5008a8323d76773b836199cdecf708fdb993f0f0544d9475176837ab' "$work/code.deb" | sha256sum -c -
          [[ $(dpkg-deb -f "$work/code.deb" Package) == code &&
             $(dpkg-deb -f "$work/code.deb" Version) == 1.147.0-1794903003 &&
             $(dpkg-deb -f "$work/code.deb" Architecture) == amd64 ]]
          # Use the package manager on this disposable runner. The official
          # package owns chrome-sandbox as root:root mode 4755, unlike a user tar extraction.
          printf 'code code/add-microsoft-repo boolean false\n' | sudo debconf-set-selections
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends --allow-downgrades -y "$work/code.deb"
          helper_mode=$(stat -c '%U:%G:%a' /usr/share/code/chrome-sandbox)
          printf 'Microsoft official package chrome-sandbox: %s\n' "$helper_mode"
          [[ "$helper_mode" == root:root:4755 ]]
          curl --fail --silent --show-error --location --compressed --retry 3 --connect-timeout 20 --max-time 60 \
            'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/GitHub/vsextensions/github-vscode-theme/6.3.5/vspackage' \
            -o "$work/theme.download"
          if [[ $(od -An -tx1 -N2 "$work/theme.download" | tr -d ' ') == 1f8b ]]; then
            gzip -dc "$work/theme.download" > "$work/theme.vsix"
          else
            cp "$work/theme.download" "$work/theme.vsix"
          fi
          printf '%s  %s\n' '74e69da1804f718ae9ce6a8ea49c06fbf9cfc137c9b65b0e14353715cb5d474a' "$work/theme.vsix" | sha256sum -c -
          /usr/share/code/bin/code --version | tee "$report/vscode-version.txt"
          grep -Fx '1.147.0' "$report/vscode-version.txt"
          grep -Fx '8a14f0cc1b08d531eb83255ea3764ae22aa932b5' "$report/vscode-version.txt"
          /usr/share/code/bin/code --user-data-dir "$work/profile" --extensions-dir "$work/extensions" --install-extension "$work/theme.vsix"
          /usr/share/code/bin/code --user-data-dir "$work/profile" --extensions-dir "$work/extensions" --list-extensions --show-versions | tee "$report/theme-version.txt"
          grep -Fxi 'github.github-vscode-theme@6.3.5' "$report/theme-version.txt"
          printf '%s' '' | base64 -d > "$work/task-list/app.py"
          printf '%s  %s\n' 'f5f482eb437481c7f209fb5409715ec29f12cce8076227c8ebaddfdade536115' "$work/task-list/app.py" | sha256sum -c -
          printf '%s' '' | base64 -d > "$work/task-list/tasks.py"
          printf '%s  %s\n' '570d2abddfda7dd526adb10fbbd47404a8e0608aa5dc4fca8f31bb5b3978750e' "$work/task-list/tasks.py" | sha256sum -c -
          printf '%s' 'aW1wb3J0IGpzb24KZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCgoKZGVmIHNhdmVfdGFza3ModGFza3MsIHBhdGgpOgogICAgdGV4dCA9IGpzb24uZHVtcHModGFza3MsIGluZGVudD0yKQogICAgUGF0aChwYXRoKS53cml0ZV90ZXh0KHRleHQsIGVuY29kaW5nPSJ1dGYtOCIpCg==' | base64 -d > "$work/task-list/storage.py"
          printf '%s  %s\n' 'e34efb491a382e4abff60779969e12b1bc93b89399cff01083d76dcf5dd788c2' "$work/task-list/storage.py" | sha256sum -c -
          printf '%s' '' | base64 -d > "$work/task-list/test_tasks.py"
          printf '%s  %s\n' 'e038ee1a0b8342652f49b73aca9289b1153429f53f45e417379335af4a9582cf' "$work/task-list/test_tasks.py" | sha256sum -c -
          (cd "$work/task-list"; sha256sum *.py) > "$report/task-list-sha256.txt"
          cat > "$work/profile/User/settings.json" <<'SETTINGS'
          {
            "workbench.colorTheme": "GitHub Dark Default",
            "workbench.startupEditor": "none",
            "window.zoomLevel": 0,
            "window.menuBarVisibility": "compact",
            "window.title": "${activeEditorShort}${separator}${rootName}${separator}${appName}",
            "editor.fontFamily": "'DejaVu Sans Mono', monospace",
            "editor.fontSize": 14,
            "editor.cursorBlinking": "solid",
            "editor.minimap.enabled": true,
            "breadcrumbs.enabled": true,
            "telemetry.telemetryLevel": "off",
            "update.mode": "none",
            "extensions.autoCheckUpdates": false,
            "extensions.autoUpdate": false,
            "security.workspace.trust.enabled": false,
            "chat.disableAIFeatures": true
          }
          SETTINGS
          cp "$work/profile/User/settings.json" "$report/settings.json"
      - name: Capture genuine VS Code at 1366x768, GitHub Dark Default, selection L8 C5-13
        env:
          LC_ALL: C.UTF-8
        shell: bash
        run: |
          set -euo pipefail
          cat > "$REFERENCE_WORK/capture.sh" <<'CAPTURE'
          #!/usr/bin/env bash
          set -euo pipefail
          work=$REFERENCE_WORK
          report=$REFERENCE_REPORT
          export XDG_CONFIG_HOME="$work/xdg-config" XDG_CACHE_HOME="$work/xdg-cache"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          openbox --sm-disable > "$work/openbox.log" 2>&1 &
          wm=$!; editor=
          cleanup() {
            local status=$?
            if ((status)); then
              printf 'Capture stopped at %s with exit %s.\n' "${phase:-startup}" "$status"
              wmctrl -lpx || true
              xwininfo -root -tree | head -n60 || true
              for name in openbox.log code.log navigation.log; do
                if [[ -f "$work/$name" ]]; then
                  printf '\n-- %s --\n' "$name"
                  tail -n40 "$work/$name" || true
                fi
              done
            fi
            for pid in "$editor" "$wm"; do [[ ! $pid ]] || kill "$pid" 2>/dev/null || true; done
          }
          trap cleanup EXIT
          phase=window-manager
          for _ in {1..40}; do wmctrl -m >/dev/null 2>&1 && break; sleep .25; done
          wmctrl -m
          direct="/usr/share/code/code"
          launcher=/usr/share/code/bin/code
          isolated=(--user-data-dir "$work/profile" --extensions-dir "$work/extensions")
          phase=launch
          "$direct" "${isolated[@]}" --force-device-scale-factor=1 --disable-gpu --password-store=basic \
            --new-window "$work/task-list" > "$work/code.log" 2>&1 &
          editor=$!
          find_owned() {
            # Match the native PID and substring only. Unlike xdotool search, this
            # is stable with respect to WM_CLASS and Unicode title delimiters.
            local text=$1 listing id
            for _ in {1..100}; do
              if ! kill -0 "$editor" 2>/dev/null; then return 1; fi
              listing=$(wmctrl -lp 2>/dev/null || true)
              id=$(awk -v pid="$editor" -v needle="$text" '$3 == pid && index($0,needle) {print $1; exit}' <<<"$listing")
              if [[ $id ]]; then printf '%s\n' "$id"; return; fi
              sleep .25
            done
            return 124
          }
          phase=owned-workspace
          win=$(find_owned task-list)
          xprop -id "$win" _NET_WM_PID _NET_WM_NAME WM_CLASS
          xdotool windowactivate --sync "$win"
          phase=exact-file-navigation
          timeout 20 "$launcher" "${isolated[@]}" --reuse-window --goto "$work/task-list/app.py:8:5" \
            > "$work/navigation.log" 2>&1
          win=$(find_owned app.py)
          title=$(xdotool getwindowname "$win")
          [[ "$title" == *app.py* && "$title" == *task-list* ]]
          xprop -id "$win" _NET_WM_PID _NET_WM_NAME
          xdotool windowactivate --sync "$win"
          wmctrl -ir "$win" -b add,maximized_vert,maximized_horz
          sleep 1
          phase=selection
          xdotool key --clearmodifiers --repeat 8 --delay 40 shift+Right
          xdotool key --clearmodifiers ctrl+c
          selected=$(timeout 5 xclip -selection clipboard -out)
          [[ "$selected" == add_task ]] || { printf 'Unexpected clipboard selection: %q\n' "$selected"; exit 1; }
          phase=frame
          xdotool mousemove 1320 725
          import -window root "$report/vscode-github-dark-default-task-list.png"
          test "$(identify -format '%wx%h' "$report/vscode-github-dark-default-task-list.png")" = 1366x768
          # Ensure the editor background is actually rendered, rather than a blank or modal screen.
          editor_color=$(convert "$report/vscode-github-dark-default-task-list.png" -format '%[pixel:p{900,440}]' info:)
          printf 'Editor pixel: %s\n' "$editor_color"
          [[ "$editor_color" == 'srgb(13,17,23)' || "$editor_color" == 'srgba(13,17,23,1)' ]]
          {
            xdpyinfo | grep -E 'dimensions:|resolution:'
            fc-match 'DejaVu Sans Mono' -f '%{family} %{style}\n'
            printf '%s\n' "workspace=task-list" "file=app.py" \
              "theme=GitHub Dark Default" "windowZoom=0" "editorFontSize=14px" \
              "start=line 8 col 5; caret=line 8 col 13; selected text=$selected" \
              "editor sampled color=$editor_color"
          } > "$report/frame-state.txt"
          CAPTURE
          dbus-run-session -- xvfb-run -a -s '-screen 0 1366x768x24 -dpi 96 -nolisten tcp' bash "$REFERENCE_WORK/capture.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: official-vscode-task-list-reference
          path: ${{ runner.temp }}/reference-evidence/
          if-no-files-found: error
          retention-days: 10
