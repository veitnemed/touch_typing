name: Complete TouchTyping 1.9.0 Wayland qualification (no publish)
on:
  push:
    branches: [qa/win10-190-wayland-mirror]
permissions:
  actions: read
  contents: read
jobs:
  ubuntu-window:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: touchtyping-190-verified-candidate
          path: ${{ runner.temp }}/archive
          github-token: ${{ github.token }}
          run-id: 45218762089
      - name: Install GNOME and GTK test-session dependencies
        shell: bash
        run: |
          set -euo pipefail
          sources="$RUNNER_TEMP/win10-noble-sources.list"
          cat > "$sources" <<'APT'
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu/ noble main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu/ noble-updates main universe
          deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu/ noble-security main universe
          APT
          options=(
            -o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=-
            -o Acquire::Retries=2 -o Acquire::https::Timeout=25 -o Acquire::http::Timeout=25 )
          pkgs=(gnome-shell gsettings-desktop-schemas gir1.2-gtk-4.0 python3-gi
                python3-gi-cairo python3-cairo dbus-x11 fonts-dejavu-core libgl1-mesa-dri)
          sudo timeout --kill-after=15s 180s apt-get "${options[@]}" -o APT::Update::Error-Mode=any update
          sudo timeout --kill-after=15s 540s apt-get "${options[@]}" -y --download-only --no-install-recommends install "${pkgs[@]}"
          sudo timeout --kill-after=15s 300s apt-get "${options[@]}" -y --no-download --no-install-recommends install "${pkgs[@]}"
          gnome-shell --version
          /usr/bin/python3 -c 'import gi; gi.require_version("Gtk","4.0"); from gi.repository import Gtk; print("GTK", Gtk.get_major_version(), Gtk.get_minor_version())'
      - name: Drive both desktop profiles using native GTK Wayland keyboard input
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/archive"
          sha256sum -c SHA256SUMS.txt
          echo 'f4bae44d6c2e57d6f9184e5edcd41ae74e7da29774a9cfa7925bc4f8a2a68f51  touch-typing-v1.9.0-linux-x64.tar.gz' | sha256sum -c
          tar -xzf touch-typing-v1.9.0-linux-x64.tar.gz
          cd touch-typing-linux-x64
          base64 -d > "$RUNNER_TEMP/win10-wayland.patch" <<'QA_PATCH'
