name: Publish TouchTyping Windows x64 beta
on:
  push:
    branches: [release/v1.8.0-preview.5-windows-beta]
permissions:
  actions: read
  contents: write
concurrency:
  group: touchtyping-windows-beta-preview-5
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: '6753e60262eed0a5f9318bd6337fbb69dd9ce82b'
      RUN: '45131568267'
      WINDOWS_SHA256: 'df3412de20cdcdef60a730fce36eed85a970973cbf98c6d6dd471adf4d11994c'
      REPO: 'veitnemed/touch_typing'
      TAG: 'v1.8.0-preview.5-windows-beta'
    steps:
      - name: Publish only the exact verified Windows ZIP
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$RUN" | jq -e --arg sha "$CANDIDATE_SHA" '
            .head_sha == $sha and .head_branch == "feature/reference-ui"
            and .path == ".github/workflows/live-input-candidate.yml"' >/dev/null
          gh api "repos/$REPO/actions/runs/$RUN/jobs?per_page=50" | jq -e '
            .jobs as $j | ["engine","windows-package","windows-window"] |
            all(. as $name | any($j[]; .name==$name and .conclusion=="success")) and
            any($j[]; .name=="windows-window" and any(.steps[]; .name=="Exercise daily editor and GNOME missions in native WPF" and .conclusion=="success"))' >/dev/null
          mkdir -p "$RUNNER_TEMP/windows-beta"
          cd "$RUNNER_TEMP/windows-beta"
          gh run download "$RUN" --repo "$REPO" --name windows-x64-candidate --dir .
          sha256sum -c SHA256SUMS.txt
          echo "$WINDOWS_SHA256  touch-typing-windows-x64.zip" | sha256sum -c
          unzip -tq touch-typing-windows-x64.zip
          unzip -Z1 touch-typing-windows-x64.zip > files.txt
          grep -Fx 'Start-Live.cmd' files.txt
          grep -Fx 'TouchTyping.exe' files.txt
          for asset in Roboto-Regular.ttf Roboto-Medium.ttf Roboto-Bold.ttf OFL.txt ROBOTO-SOURCE.txt; do
            grep -Fx "fonts/$asset" files.txt
          done
          if grep -E '(^|/)progress\.xml$' files.txt; then echo 'Unexpected user profile'; exit 1; fi
          mv touch-typing-windows-x64.zip "touch-typing-$TAG-x64.zip"
          sha256sum "touch-typing-$TAG-x64.zip" > SHA256SUMS.txt
          cat > notes.md <<'NOTES'
          Отдельная переносимая бета Windows x64. Распакуйте ZIP целиком в отдельную папку и запустите `Start-Live.cmd`. Требуется .NET Framework 4.8 или совместимая новая версия. Windows 10/11 на рабочем ПК и системный масштаб 125–150% пока не подтверждены; проверено на Windows Server 2025. Индикатор RU/EN следует системной раскладке в проверенных упражнениях.
          
          В каталоге VS Code появились три коротких упражнения: переход к определению и возврат на ту же позицию, поиск использований и переименование, а также редактирование выбранной строки. Команда Ctrl+/ больше не комментирует следующую строку, а удаление и отмена проверяются отдельно.
          
          В каталоге Ubuntu появилась миссия с документацией и редактором: привязка окон к половинам экрана, разворачивание, восстановление, сворачивание и возврат к тому же файлу и каретке.
          
          Сборка сохраняет предыдущие улучшения: компактное окно занятия, независимые таймер и лимит действий, мягкое завершение, поддержку видимых символов и выделения переноса строки.
          
          Это предварительный выпуск, не полная приёмка всех функций.
          NOTES
          printf '\nZIP без пересборки из [прошедшего прогона](https://github.com/%s/actions/runs/%s) на `%s`.\n' "$REPO" "$RUN" "$CANDIDATE_SHA" >> notes.md
          gh release create "$TAG" --repo "$REPO" --target "$CANDIDATE_SHA" --prerelease --latest=false \
            --title "TouchTyping v1.8.0-preview.5 — Windows x64 beta" --notes-file notes.md \
            "touch-typing-$TAG-x64.zip" SHA256SUMS.txt
